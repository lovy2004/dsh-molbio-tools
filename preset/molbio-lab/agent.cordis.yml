# The `standard` agent preset: the full coding agent, mounted once per process.
#
# ── WHAT THIS FILE IS (0.1.7-alpha.1 and later) ─────────────────────────────
#
# This is a ROW LIST. It is no longer a file DSH discovers: as of
# dsh 0.1.7-alpha.1 the harness "neither scans directories nor accepts preset
# paths" (@deepseek-ai/dsh-agent-preset-registry), and the package that used to
# scan them — @deepseek-ai/dsh-agent-presets — no longer ships. A preset is now
# a `@deepseek-ai/dsh-agent-preset` ROW whose `config.plugins` carries exactly
# these rows.
#
# `build/preset-patch.mjs` wraps this list into that row and writes the package's
# single bundle patch `cordis.patch.yml` (anchor insert + preset insert), which
# `package.json` declares as `dsh.bundle.patch`. So the BUNDLE installs the preset:
#
#     dsh plugin --profile <p> add dsh-molbio-tools
#
# Edit THIS file, then run `node build/preset-patch.mjs`.
#
# NOTE: the mode is the ONLY place these 60 tools load. The same bundle patch's
# other insert (`molbio-client` → `./host.mjs`) deliberately registers nothing —
# registering the tool at the host level as well would put it in every session
# and is not what this package is for.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; the preset registry rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)
#
# ── How this file is maintained ─────────────────────────────────────────────
#
# This row list is a COPY of the DSH-shipped `standard` preset with ONE
# intentional difference: the trailing `tool-molbio` row. Everything else —
# every row, every config key, in upstream's ORDER — is upstream's
# `config.plugins:` block, de-indented by ten spaces. This release's upstream
# list carries no comments of its own, so none appear below; provenance and the
# upgrade rules live in this header.
#
# Baseline: the `standard` preset of dsh 0.2.1-rc.3 (harness root
# `%APPDATA%\npm\node_modules\@deepseek-ai\dsh`, file
# `node_modules/@deepseek-ai/dsh-web-app/presets/standard.patch.yml`, whose
# rows live under the `preset-standard` row's `config.plugins:`).
#
# 0.2.1-rc.3 ships the SAME row list as 0.2.1-rc.2 (verified by diffing the
# file), so no row changed in this bump. The last upstream row change was
# 0.2.1-rc.2: it added `time-context`, `tool-schedule` and `tool-plugin-market`;
# dropped the two disabled optional subagent providers (`tool-subagent-codex`,
# `tool-subagent-claude-code`) and `tool-ralph`; dropped the persona `suffix` and
# both `backgroundMode: continuable` settings; and reworded the plan-mode
# section. Absorb such a bump verbatim — see workflow.md §4.
#
# Keeping the text verbatim is not cosmetic: a preset mounts DSH's OWN
# packages, so upstream drift here kills the whole preset at mount (the failure
# mode of 0.1.5-alpha.2, when `dsh-persona` replaced `text:` with
# `prefix:`/`suffix:` and this composition stopped appearing in the picker).
# v17 shipped with `@deepseek-ai/dsh-workflow-worker-thread`, a package no
# released DSH installs; `test/preset-health.mjs` caught it as an unmountable
# row.
#
# Three rules when absorbing a DSH upgrade:
#   1. copy upstream changes — including comments and key order — instead of
#      hand-writing an equivalent-looking row, so the drift check stays quiet
#      for the right reason;
#   2. re-run `node build/preset-patch.mjs`, then `node test/preset-health.mjs`,
#      which validates every row's config against the INSTALLED package's own
#      schema and reports drift; only the allowed difference above may remain;
#   3. `node test/drift-probe.mjs` must still catch its mutations — a guard
#      nobody has seen fail is not a guard.
#
# Do NOT "fix" `present` (or any other row) by hand to suit the toolset: if the
# upstream row is wrong for this preset, fix it upstream, not here.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: You are a coding agent powered by the {{model}} model.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
- id: time-context
  name: '@deepseek-ai/dsh-time-context'
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
- id: tool-schedule
  name: '@deepseek-ai/dsh-tool-schedule'
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

          Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

          The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

          Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

          Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

          When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
- id: present
  name: '@deepseek-ai/dsh-tool-present'
- id: tool-plugin-manager
  name: '@deepseek-ai/dsh-plugin-manager/tools'
  disabled: true
- id: tool-plugin-market
  name: '@deepseek-ai/dsh-plugin-market/tools'
  disabled: true

# dsh-molbio-tools: molecular-biology toolset (60 tools across sequence
# analysis, primers (incl. TaqMan probes and multiplex compatibility),
# in-silico PCR, cloning (incl. Golden Gate), enzyme catalog, methylation-aware
# and double digests, plasmids, Sanger verification, proteins (incl. helical
# wheel/hydropathy plots), qPCR, virtual gels, multiple sequence
# alignment/conservation (every supplied residue is conserved), sequence logos,
# codon-usage analysis, phylogenetic trees (bootstrap + Newick, long labels
# wrapped), CpG-island/GC-skew composition, read-level FASTQ QC, CRISPR gRNA
# design, and literature/protocol/experiment records).
# Registers into the host `tools` registry and publishes no service, so it
# needs no isolate realm.
#
# The specifier is the PACKAGE NAME, resolved by Node from the profile's
# node_modules — not a `./plugins/…` path. A relative specifier here does NOT
# work on DSH 0.1.7-alpha.1: the preset mounts, but the entry is created without
# ever being imported, so the roster reports the mode as broken and it loads
# zero tools:
#
#     tool-molbio (./plugins/dsh-molbio-tools-v20/index.mjs): never started
#
# A bare name is also what makes upgrades automatic: `dsh plugin update` moves
# the package and this row follows it. The per-release `plugins/dsh-molbio-
# tools-vN/` copies existed only to work around ESM module-cache reuse of a
# relative file URL, which a resolved package name does not have.
- id: tool-molbio
  name: 'dsh-molbio-tools'
