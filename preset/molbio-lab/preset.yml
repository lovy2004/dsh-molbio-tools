name: Molecular Biology Lab
description: 分子生物学专属模式：标准编码能力 + 52 个 molbio_* 工具（序列分析、引物设计（含跨内含子 qPCR、盐/浓度旋钮与目标位置偏好）、TaqMan 水解探针设计与多重 PCR 互扰检查、克隆模拟与选酶（含 Golden Gate）、酶目录查询、甲基化敏感位点与双酶切 buffer 兼容检查、多序列比对与保守性分析（含 sequence logo 图）、CRISPR gRNA 设计与脱靶搜索、SnapGene/GenBank 解析与质粒图谱、Sanger 测序验证、蛋白性质/密码子优化/螺旋轮投影与疏水性图、qPCR 与绘图、虚拟凝胶——生成的 SVG 图片自动用系统默认应用打开，文献/协议/实验记录）。
