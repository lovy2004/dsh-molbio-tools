name: release

# ── What this is ────────────────────────────────────────────────────────────
#
# `test.yml` is the gate; this is the delivery. Pushing a `v<version>` tag
# publishes the two npm entries this repository owns and opens a GitHub Release
# whose notes are the CHANGELOG's section for that version.
#
# ── Why a tag, and not every push to main ───────────────────────────────────
#
# The version IS the release decision. There is no auto-versioning here: a
# maintainer bumps `package.json`, writes the CHANGELOG section, commits, and
# tags. So the tag is the only signal that means "this is a release", and it is
# also the one that cannot be sent by accident — pushing a branch publishes
# nothing.
#
# ── Why there is no NPM_TOKEN ───────────────────────────────────────────────
#
# Publishing uses npm's TRUSTED PUBLISHING: the job presents a GitHub OIDC token
# (`id-token: write` below) and npm exchanges it for a short-lived credential
# scoped to this repository and this workflow file. Nothing long-lived is stored
# in the repository, so there is no token to leak, rotate or forget. The tradeoff
# is that npm must already know the package — a trusted publisher is configured
# per package on npmjs.com — so the FIRST release of each package has to be done
# by hand. `docs/workflow.md` section 4 walks through it; the preflight below
# detects that case and says so, instead of letting `npm publish` fail with an
# opaque 404.
#
# ── Why the suite runs again here ───────────────────────────────────────────
#
# A tag may point at a commit no branch has, and a tag push triggers `test.yml`
# in PARALLEL with this workflow — so "the tests passed" is not something this
# job can assume about the commit it is about to publish. Re-running them costs a
# few minutes and makes the published artifact one this workflow verified itself.

on:
  push:
    tags:
      - 'v*'
  # Dry run. Runs every step except the publishes and the GitHub Release, so the
  # pipeline can be exercised without spending a version number npm will not let
  # anyone reuse.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to pretend was pushed (for example v0.19.0)'
        required: true
        type: string

# One release at a time: two GITHUB RELEASES for one tag is not something a
# re-run repairs, and two concurrent publishes of the same version end with a
# confusing "cannot publish over an existing version".
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  id-token: write # mint the OIDC token trusted publishing exchanges

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          # NO `registry-url`, deliberately. It makes setup-node write an
          # `.npmrc` with a `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
          # line, and trusted publishing works by having NO usable token: npm
          # performs the OIDC exchange only when it cannot authenticate any other
          # way. The public registry is npm's default, so omitting this changes
          # nothing except removing the chance of an empty-token `.npmrc`
          # suppressing the exchange.

      # TWO SEPARATE QUESTIONS, and conflating them was a defect:
      #
      #   `publish` — may this run put NEW versions on npm? Only a tag push says
      #               yes. A manual run must never spend a version number.
      #   `release` — may this run record the release (GitHub Release from the
      #               CHANGELOG)? Both a tag push AND a manual run say yes.
      #
      # The first version tied the GitHub Release to `publish`, so a manual run
      # could never create one — which is exactly the run you want after a manual
      # bootstrap publish, when the npm versions are already out and only the
      # Release is missing. The publish steps still consult `publish`; the notes
      # step consults `release`.
      - name: Decide what this run may do
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing: triggered by tag ${{ github.ref_name }}"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Manual run: no publish, but the GitHub Release is still created"
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      # Delegated to `tagVersion` rather than written as a shell glob: a glob
      # cannot express "three numeric components", so it would admit `v1.2.3-any`
      # and `v1x2y3` while the preflight later rejects them — two gates
      # disagreeing about what a release tag is.
      - name: Assert the tag is a release tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module -e "
            import { tagVersion } from './build/release-preflight.mjs';
            const parsed = tagVersion(process.env.TAG ?? '');
            if (parsed.error !== undefined) { console.error('::error::' + parsed.error); process.exit(1); }
            console.log('release tag:', process.env.TAG, '-> version', parsed.version);
          "

      # Trusted publishing needs npm >= 11.5.1. The Node above ships one, but the
      # floor is asserted rather than assumed: when it is not met, npm does not
      # attempt the OIDC exchange and the failure surfaces later as a 401 that
      # says nothing about the real cause.
      #
      # The rule and the version detection live in `build/release-preflight.mjs`,
      # which the suite tests. The first version of this step read
      # `npm_config_user_agent` inline — and that variable IS NOT SET in a `run:`
      # step, because npm sets it only for scripts IT spawns. The step therefore
      # failed with "cannot read the npm version" before anything else ran.
      # Reading `npm --version` asks the tool that will actually publish.
      - name: Assert the npm CLI supports trusted publishing
        run: |
          node --input-type=module -e "
            import { detectNpmVersion, npmVersionSupport } from './build/release-preflight.mjs';
            const { text } = detectNpmVersion();
            const support = npmVersionSupport(text);
            if (!support.ok) { console.error('::error::' + support.reason); process.exit(1); }
            console.log('node ' + process.versions.node + ' with ' + support.text);
          "

      - name: Install the DSH baseline the guards compare against
        run: npm install --global --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2

      # Same derivation as test.yml: on a runner npm's global prefix is the Node
      # toolchain directory, and several guards resolve the harness through
      # `benchmark/harness.mjs`.
      - name: Point the guards at the harness they just installed
        run: >-
          node --input-type=module -e "import { execFileSync } from 'node:child_process';
          import { existsSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const prefix = execFileSync('npm', ['prefix', '-g'], { encoding: 'utf8', shell: process.platform === 'win32' }).trim();
          const root = [join(prefix, 'node_modules', '@deepseek-ai', 'dsh'), join(prefix, 'lib', 'node_modules', '@deepseek-ai', 'dsh')].find((c) => existsSync(join(c, 'package.json')));
          if (root === undefined) { console.error('the harness is not under the prefix npm reports:', prefix); process.exit(1); }
          appendFileSync(process.env.GITHUB_ENV, 'DSH_HARNESS_ROOT=' + root + '\n');
          console.log('DSH_HARNESS_ROOT =', root);"

      # The same suite test.yml runs, on the exact commit being published. It
      # includes the benchmark offline gates and the client-artifact freshness
      # check, which is what makes the publish steps safe to attempt.
      - name: Run the suite on the tagged commit
        run: npm test
        env:
          MOLBIO_AUTO_VIEW: '0'

      # The release-specific invariants: tag vs declared version, a CHANGELOG
      # section worth publishing as notes, the client-half manifest fields a
      # profile looks for, and whether the panel's independent version line has
      # fallen behind a changed artifact.
      #
      # It also DECIDES what may be published, and writes that decision to
      # `GITHUB_OUTPUT` for the steps below. The first real release reached
      # `npm publish` for a package that does not exist on npm and failed with
      # `ENEEDAUTH`: trusted publishing cannot create a package, because the
      # trusted publisher is configured per package and there is nothing to
      # authenticate against until the name exists. The preflight had already
      # detected that and only printed a note — a gate that detects a condition
      # and does not act on it is not a gate. It now refuses, before anything
      # touches the registry.
      - name: Release preflight
        id: preflight
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node build/release-preflight.mjs --tag "$TAG"

      # Both conditions are required: the event decides whether this run publishes
      # at all (a manual dispatch is a dry run), and the preflight decides whether
      # npm knows this package well enough to authenticate.
      - name: Publish dsh-molbio-tools
        if: steps.mode.outputs.publish == 'true' && steps.preflight.outputs.publish_tools == 'true'
        run: npm publish --access public --provenance
        env:
          # No NODE_AUTH_TOKEN on purpose: with none set, npm performs the OIDC
          # exchange. Setting it to an empty string DISABLES trusted publishing,
          # which is the classic silent failure for this mechanism.
          NPM_CONFIG_PROVENANCE: 'true'

      # The panel is a SEPARATE npm entry and must be published from its own
      # directory: two `npm publish` runs in the repository root publish the root
      # package twice (recorded in docs/workflow.md, section 4).
      - name: Publish dsh-molbio-panel
        if: steps.mode.outputs.publish == 'true' && steps.preflight.outputs.publish_panel == 'true'
        working-directory: packages/molbio-panel
        run: npm publish --access public --provenance
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      # Last. Guarded by `release`, not `publish`: a manual run is exactly how a
      # release whose npm versions were bootstrapped by hand gets its GitHub
      # Release, and by then the publish steps above are correctly skipped.
      # success() is required: without it this step's explicit `if` REPLACES
      # GitHub's implicit success() gate, so a failed publish could still create
      # a Release whose npm versions do not exist.
      - name: Create the GitHub Release
        if: success() && steps.mode.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node build/release-notes.mjs --tag "$TAG" --out release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
