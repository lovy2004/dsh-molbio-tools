name: tests

# The suite IS this project's quality model — every guard in `docs/rules.md`
# rule 9 ("a guard nobody has seen fail is not a guard") only counts if it runs
# where a change lands. Before this file existed, `npm test` ran when a human
# remembered to type it, which is how two released versions once lived only in a
# working tree.
#
# ── Why both platforms ─────────────────────────────────────────────────────
#
# The matrix runs the suite on Windows AND Linux. It used to be Windows only,
# because the fixtures' session cwd was the literal `C:/tmp` and the tools build
# paths with `node:path`, so on Linux those assertions failed on the separator —
# reporting the runner's path semantics instead of anything this repository owns.
# That is fixed: the tests derive every path from one root (`const CWD = …` plus
# `at()`/`shown()` helpers), so both platforms now assert the same thing. Linux is
# also the cheaper runner and has no MAX_PATH limit, which `npm install --global`
# of a deeply nested package can hit on Windows.
#
# ── Why the harness is installed, and why it is PINNED ──────────────────────
#
# Several guards compare this repository against the DSH it ships for
# (`test/contract.mjs`, `preset-health.mjs`, `drift-probe.mjs`, `smoke.mjs`,
# `client-mount.mjs`, `map-card.mjs`, `benchmark-profile.mjs` resolve it through
# `benchmark/harness.mjs`). That harness comes from npm, so CI installs it —
# pinned to the exact baseline `docs/roadmap.md` declares the package verified
# against. Pinning is the point: with `@latest` a red build would mean "DSH
# moved", and the guards would be reporting the environment instead of this
# repository. Bumping the pin is a deliberate act, done together with the
# `docs/workflow.md` post-upgrade pass — never as a drive-by.
#
# The package itself has no dependencies, so there is no install step for it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The engine floor `package.json` declares. A newer Node is what local
        # development runs; add it here when a version-specific change lands.
        node: ['22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install the DSH baseline the guards compare against
        run: npm install --global --no-audit --no-fund @deepseek-ai/dsh@0.1.7-rc.1

      # Every guard resolves the harness through `benchmark/harness.mjs`. Say
      # exactly what was installed rather than leaving each probe to guess: on a
      # runner npm's global prefix is the Node toolchain's directory, NOT the
      # `%APPDATA%\npm` a normal Windows user install lands in — and one probe
      # (test/client-mount.mjs) hardcoded that path, which is how the first run of
      # this workflow failed every job. Node does the path arithmetic so the same
      # step works whichever shell the runner uses.
      - name: Point the guards at the harness they just installed
        run: >-
          node --input-type=module -e "import { execFileSync } from 'node:child_process';
          import { existsSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const prefix = execFileSync('npm', ['prefix', '-g'], { encoding: 'utf8', shell: process.platform === 'win32' }).trim();
          const root = [join(prefix, 'node_modules', '@deepseek-ai', 'dsh'), join(prefix, 'lib', 'node_modules', '@deepseek-ai', 'dsh')].find((c) => existsSync(join(c, 'package.json')));
          if (root === undefined) { console.error('the harness is not under the prefix npm reports:', prefix); process.exit(1); }
          appendFileSync(process.env.GITHUB_ENV, 'DSH_HARNESS_ROOT=' + root + '\n');
          console.log('DSH_HARNESS_ROOT =', root);"

      # Printed before the suite so a red build is readable from the log alone:
      # this distinguishes "the harness is missing" from "a guard found something".
      - name: Report the harness the guards resolved
        run: node --input-type=module -e "import { findHarnessRoot } from './benchmark/harness.mjs'; console.log('platform:', process.platform, 'node:', process.version); console.log('DSH_HARNESS_ROOT:', process.env.DSH_HARNESS_ROOT); const root = findHarnessRoot(); if (root === undefined) { console.error('no harness resolved'); process.exit(1); } console.log('harness:', root);"

      - name: Run the suite
        run: npm test
        env:
          # The image tools open the generated SVG with the desktop opener unless
          # this is set (docs/rules.md rule 8).
          MOLBIO_AUTO_VIEW: '0'
