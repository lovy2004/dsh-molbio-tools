# dsh-molbio-tools bundle patch — the one file `dsh.bundle.patch` names.
#
# GENERATED by build/preset-patch.mjs. Edit the row list in
# preset/molbio-lab/agent.cordis.yml (and the picker strings in preset.yml), then
# re-run `node build/preset-patch.mjs`; hand edits here are reverted by the next
# run, and `node build/preset-patch.mjs --check` fails while the two disagree.
#
# Two top-level inserts, applied in this order:
#   1. molbio-client      — inert host anchor for the browser half (see below)
#   2. preset-molbio-lab  — the "Molecular Biology Lab" agent preset

# ── 1. the CLIENT-BUNDLE ANCHOR ────────────────────────────────────────────
#
# `host.mjs` registers no tool and publishes no service. Its only job is to be a
# loader row DSH's client-module scan can see: that scan walks the HOST Loader
# tree, reads the row's package manifest, and takes `dsh.client` +
# `exports["./client"]` from it to compose `window.__DSH_BOOT__`. A preset's rows
# live in an isolated subtree the scan never visits, so a `dsh.client` package
# referenced only from inside a preset loses its only discoverable row and its
# right-sidebar tabs silently disappear.
#
# Keep the tool in the PRESET and only the anchor here. An earlier version of
# this file inserted a host row for the tool itself (`name: dsh-molbio-tools`),
# which both registered all 60 tools globally and collided with the preset's own
# copy of that row:
#
#     broken: "tool-molbio (...): never started"
- insert:
    - id: molbio-client
      name: './host.mjs'

# ── 2. the MOLECULAR BIOLOGY LAB PRESET ───────────────────────────────────
#
# DSH 0.1.7-alpha.1 removed the `<dshHome>/.agent-presets` directory scan: a
# preset is now a `@deepseek-ai/dsh-agent-preset` ROW in a bundle patch, which
# is what this insert declares. Because the BUNDLE registers it,
# `dsh plugin --profile <p> add dsh-molbio-tools` puts the mode in the picker
# with no copy step and no preset-root patch — see README「安装」.
#
# `order: 5` is deliberate: the shipped presets occupy 1..4 (standard, ptc,
# minimal, cordis) and the registry sorts by `order` with an id tie-break, so a
# shared number would let the picker order depend on alphabetical accident.
- insert:
    - id: preset-molbio-lab
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: molbio-lab
        order: 5
        name: Molecular Biology Lab
        description: "分子生物学专属模式：标准编码能力 + 60 个 molbio_* 工具（序列分析、引物设计（含跨内含子 qPCR、盐/浓度旋钮与目标位置偏好）、TaqMan 水解探针（含 MGB 与订购 CSV）与多重 PCR 互扰/退火温度/浓度建议、克隆模拟与选酶（含 Golden Gate）、酶目录查询、甲基化敏感位点与双酶切 buffer 兼容检查、多序列比对（每个输入残基都会进比对结果）、保守性分析与比对后处理（共识/缺口修剪/同一性矩阵/逐列覆盖度，含 sequence logo 图）、CRISPR gRNA 设计（SpCas9/SaCas9/Cas12a/Cas13，家族特定 PAM/PFS/种子）与脱靶搜索、SnapGene/GenBank 解析与质粒图谱、Sanger 测序验证、蛋白性质/密码子优化/螺旋轮投影与疏水性图、qPCR 与绘图、虚拟凝胶、实验台分析（FASTQ 质控、密码子使用、系统发生树（长叶名自动折行）、in-silico PCR、CpG/GC 组成、批量文件分析/CSV）、静默酶切位点突变设计——生成的 SVG 图片自动用系统默认应用打开，文献/协议/实验记录）。"
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true

          # dsh-molbio-tools: molecular-biology toolset (60 tools across sequence
          # analysis, primers (incl. TaqMan probes and multiplex compatibility),
          # in-silico PCR, cloning (incl. Golden Gate), enzyme catalog, methylation-aware
          # and double digests, plasmids, Sanger verification, proteins (incl. helical
          # wheel/hydropathy plots), qPCR, virtual gels, multiple sequence
          # alignment/conservation (every supplied residue is conserved), sequence logos,
          # codon-usage analysis, phylogenetic trees (bootstrap + Newick, long labels
          # wrapped), CpG-island/GC-skew composition, read-level FASTQ QC, CRISPR gRNA
          # design, and literature/protocol/experiment records).
          # Registers into the host `tools` registry and publishes no service, so it
          # needs no isolate realm.
          #
          # The specifier is the PACKAGE NAME, resolved by Node from the profile's
          # node_modules — not a `./plugins/…` path. A relative specifier here does NOT
          # work on DSH 0.1.7-alpha.1: the preset mounts, but the entry is created without
          # ever being imported, so the roster reports the mode as broken and it loads
          # zero tools:
          #
          #     tool-molbio (./plugins/dsh-molbio-tools-v20/index.mjs): never started
          #
          # A bare name is also what makes upgrades automatic: `dsh plugin update` moves
          # the package and this row follows it. The per-release `plugins/dsh-molbio-
          # tools-vN/` copies existed only to work around ESM module-cache reuse of a
          # relative file URL, which a resolved package name does not have.
          - id: tool-molbio
            name: 'dsh-molbio-tools'
