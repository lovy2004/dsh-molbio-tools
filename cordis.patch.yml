# dsh-molbio-tools bundle layer: the CLIENT-BUNDLE ANCHOR.
#
# ── WHAT THIS LAYER INSERTS, AND WHY IT IS NOT THE TOOL ────────────────────
#
#     - id: molbio-client
#       name: './host.mjs'      # inert host half; see host.mjs
#
# The 57 tools are NOT here. They load only inside the molbio-lab preset, which
# is the point of that mode (see preset/molbio-lab/agent.cordis.yml, whose row is
# generated into preset.patch.yml — the bundle's SECOND patch layer).
#
# This row exists because DSH's client-module scan walks the HOST Loader tree
# only. It reads each live host row's package manifest, takes `dsh.client` and
# `exports["./client"]` from it, and composes the browser graph that becomes
# `window.__DSH_BOOT__`. A preset's rows live in an isolated subtree that scan
# never visits.
#
# So when the tools moved into the preset, this package lost its only host-plane
# row, its bundle stopped reaching the page, and the two right-sidebar tabs
# (Molbio / Papers) silently disappeared: the panel code was still in the
# artifact, nothing ever loaded it. `host.mjs` restores exactly one inert row so
# the browser half is discoverable again — without putting any tool into a
# session that did not choose the molbio-lab mode.
#
# An earlier version of this file inserted a host row for the tool itself
# (`name: dsh-molbio-tools`), which both registered all 57 tools globally and
# collided with the preset's own copy of that row:
#
#     broken: "tool-molbio (...): never started"
#
# Keep the tool in the PRESET and only the anchor here.
- insert:
    - id: molbio-client
      name: './host.mjs'
